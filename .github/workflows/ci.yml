name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-launcher:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Windows launcher regression tests (no Flutter or device required)
        shell: powershell
        run: ./tools/test_tool.ps1
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install matching Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "4cf24164269a5ebf0c16a028a00727d0e77bbb05"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prepare dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0
          flutter --version
          flutter config --no-analytics
          flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Lyrics utility tests
        run: python3 -m unittest discover -s tools/lyrics_alignment -p 'test_*.py'
      - name: Music intake utility tests
        run: python3 -m unittest discover -s tools/harmony-music-intake -p 'test_*.py'
      - name: Native metadata parser tests
        run: bash android/gradlew -p android/tag-parser-core test --no-daemon
      - name: Compile Android debug APK (not a public release)
        run: flutter build apk --debug --target-platform android-arm64 --no-pub
